<app-section-shell
  code="3.4"
  [title]="'sections.computed.title' | translate"
  [theory]="'sections.computed.theory' | translate"
  [docUrl]="docUrl"
  [simile]="'sections.computed.simile' | translate"
  [examples]="'sections.computed.examples' | translate"
>
  <!--
    Código de los ejercicios (con TODOs), copiable. Se proyectan en la mitad
    izquierda. El shell acepta varios nodos [exercise-code]: se apilan en orden.
  -->
  <app-code-block
    exercise-code
    [code]="exerciseCode"
    language="TypeScript"
    filename="1 · computed-exercise.ts"
  />
  <app-code-block
    exercise-code
    [code]="exerciseCode2"
    language="TypeScript"
    filename="2 · inventario-exercise.ts"
  />

  <!-- Ejercicios en vivo. Se proyectan en la mitad derecha ("Resultado"). -->
  <app-computed-exercise exercise-result />
  <app-inventario-exercise exercise-result />
</app-section-shell>
