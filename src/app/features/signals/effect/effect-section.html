<app-section-shell
  code="3.5"
  [title]="'sections.effect.title' | translate"
  [theory]="'sections.effect.theory' | translate"
  [theoryList]="'sections.effect.theoryList' | translate"
  [docUrl]="docUrl"
  [simile]="'sections.effect.simile' | translate"
  [examples]="'sections.effect.examples' | translate"
>
  <!--
    Código de los ejercicios (con TODOs), copiable. Se proyectan en la mitad
    izquierda. El shell acepta varios nodos [exercise-code]: se apilan en orden.
  -->
  <app-code-block
    exercise-code
    [code]="exerciseCode"
    language="TypeScript"
    filename="1 · effect-exercise.ts"
  />
  <app-code-block
    exercise-code
    [code]="exerciseCode2"
    language="TypeScript"
    filename="2 · buscador-exercise.ts"
  />

  <!-- Ejercicios en vivo. Se proyectan en la mitad derecha ("Resultado"). -->
  <app-effect-exercise exercise-result />
  <app-buscador-exercise exercise-result />
</app-section-shell>
