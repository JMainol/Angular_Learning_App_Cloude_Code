<app-section-shell
  code="3.1"
  [title]="'sections.signal.title' | translate"

    Código de los ejercicios (con TODOs), copiable. Se proyectan en la mitad

  -->
  <app-code-block
    exercise-code
    [code]="exerciseCode"
    language="TypeScript"
    filename="1 · signal-exercise.ts"
  />
  <app-code-block
    exercise-code
    [code]="exerciseCode2"
    language="TypeScript"
    filename="2 · ajustes-exercise.ts"
  />
  <app-code-block
    exercise-code
    [code]="exerciseCode3"
    language="TypeScript"
    filename="3 · etiquetas-exercise.ts"
  />

  <!-- Ejercicios en vivo. Se proyectan en la mitad derecha ("Resultado"). -->
  <app-signal-exercise exercise-result />
  <app-ajustes-exercise exercise-result />
  <app-etiquetas-exercise exercise-result />
</app-section-shell>
