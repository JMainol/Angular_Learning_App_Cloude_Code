<div class="panel">
  <header class="ex-head">
    <span class="ex-head__num">Ejercicio 3</span>
    <span class="ex-head__title">Lista de etiquetas · signal&lt;Array&gt;</span>
  </header>

  <!--
    Añadir: usamos una referencia de plantilla (#nueva) para leer el valor sin
    depender de FormsModule. Enter o el botón llaman a anadir() y limpian el campo.
  -->
  <div class="add">
    <input
      #nueva
      class="add__input"
      type="text"
      placeholder="Nueva etiqueta…"
      (keydown.enter)="anadir(nueva.value); nueva.value = ''"
    />
    <button type="button" class="add__btn" (click)="anadir(nueva.value); nueva.value = ''">
      Añadir
    </button>
  </div>

  <!-- Estado derivado del propio signal, sin variables extra. -->
  @if (etiquetas().length) {
    <ul class="tags">
      @for (etiqueta of etiquetas(); track etiqueta) {
        <li class="tag">
          <span class="tag__text">{{ etiqueta }}</span>
          <button type="button" class="tag__x" (click)="quitar(etiqueta)" [attr.aria-label]="'Quitar ' + etiqueta">×</button>
        </li>
      }
    </ul>
  } @else {
    <p class="empty">No hay etiquetas. Añade la primera.</p>
  }

  <footer class="foot">
    <span class="foot__count">{{ etiquetas().length }} etiqueta(s)</span>
    <button type="button" class="foot__clear" (click)="limpiar()" [disabled]="!etiquetas().length">
      Vaciar
    </button>
  </footer>
</div>
